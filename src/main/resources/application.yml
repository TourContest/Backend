spring:
  #  output:
  #    ansi:
  #      enabled: always
  #  profiles:
  #    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartcloset?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:annhj116!}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000           # 5분
      max-lifetime: 1200000          # 20분 (기존 30분에서 단축)
      connection-timeout: 30000      # 30초
      leak-detection-threshold: 5000 # 5초 (기존 2초에서 증가)

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
          time-between-eviction-runs: 5s

  jpa:
    hibernate:
      ddl-auto: update
    #    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        generate_statistics: false
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: planit745@gmail.com
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # 파일 업로드(multipart) 설정
  # 기본값이 max-file-size 1MB 라서 모바일 카메라 원본(2~5MB) 업로드가 전부 실패했음.
  # file-size-threshold 는 0(기본) 유지 → 파일이 힙이 아닌 디스크 임시파일로 저장되므로
  # 1GB 인스턴스에서도 메모리 부담 없음.
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB      # 이미지 1장 최대
      max-request-size: 35MB   # 이미지 3장 + JSON 파트 합계

  # Jackson 설정 (올바른 위치로 이동)
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

  # 비동기 처리 설정
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100
        keep-alive: 60s
        thread-name-prefix: "async-"
    scheduling:
      pool:
        size: 5
        thread-name-prefix: "scheduling-"

  # 트랜잭션 설정
  transaction:
    default-timeout: 30s

  # 캐시 설정
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10분

  # 스케줄링 활성화 (spring 하위로 이동)
  scheduling:
    enabled: false

# JWT 설정 (spring 밖으로 이동)
jwt:
  secret: ${JWT_SECRET}

aws:
  s3:
    accessKey: ${AWS_ACCESS_KEY_ID}
    secretKey: ${AWS_SECRET_ACCESS_KEY}
    bucketName: ${AWS_S3_BUCKET_NAME}
    region: ${AWS_REGION}

kakao:
  client:
    id: ${KAKAO_ID}
    secret: ${KAKAO_SECRET}
  redirect:
    url: ${KAKAO_REDIRECT_URL_SERVER}

# Firebase 설정
firebase:
  config:
    file-path: ${FIREBASE_CONFIG_PATH:classpath:firebase/jejuday.json}
  messaging:
    timeout: 10000
    retry-attempts: 3

# 알림 시스템 설정 (수정됨)
notification:
  # 캐시 TTL 설정 (더 현실적으로 수정)
  cache:
    score-ttl: 30m                    # 점수 캐시 TTL
    stats-ttl: 10m                    # 통계 캐시 TTL
    duplicate-prevention-ttl: 50ms   # 중복 방지 캐시 TTL (5초 → 0.5초로 단축)

  # 스팟 승격 설정
  promotion:
    post-to-spot-threshold: 10         # POST → SPOT 승격 기준
    spot-to-challenge-percentage: 0.3  # SPOT → CHALLENGE 승격 비율 (30%)
    time-decay-days: 14               # 시간 가중치 기준 (2주)
    min-time-weight: 0.1              # 최소 시간 가중치 (10%)

  # 점수 계산 가중치
  scoring:
    reply-weight: 1      # 댓글 가중치
    like-weight: 3       # 좋아요 가중치
    view-weight: 2       # 조회수 가중치

  # 좋아요 마일스톤 설정
  like:
    milestone-interval: 50  # 50개 단위로 알림

  # 걸음수 설정 (추가)
  step:
    daily-goal: 20000
    milestone-interval: 10000

  # FCM 설정
  fcm:
    enabled: true
    default-title: "제주데이"  # 대괄호 제거
    connection-timeout: 5000
    read-timeout: 10000

# 로깅 설정 (개발환경 최적화)
logging:
  level:
    root: ERROR
    com.goodda.jejuday: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
    check-template-location: true

# 모니터링 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,scheduledtasks
  endpoint:
    health:
      show-details: never
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    enable:
      jvm: true
      system: true
      process: true

# 성능 튜닝 설정
server:
  address: 0.0.0.0
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json
  tomcat:
    threads:
      max: 50
      min-spare: 5
    connection-timeout: 20000
    max-connections: 8192
    # 용량 초과로 요청을 거절할 때, 남은 body 를 끝까지 읽어야 에러 응답(413)이 클라이언트에 전달됨.
    # 기본 2MB 라서 그보다 큰 업로드는 커넥션이 끊기며 앱에서 Network Error 로만 보임.
    max-swallow-size: -1

app:
  cookie:
    same-site: Lax        # dev
    secure: false
  redis:
    enabled: false   # true 로 바꾸면 Redis 캐시 사용
  system-user-email: system@yourapp.local
  system-user-name: System

resilience4j:
  circuitbreaker:
    instances:
      fcm:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

tourapi:
  base-url: https://apis.data.go.kr
  service-key: ${TOUR_API_KEY}
  korservice-path: /B551011/KorService2
  system-user-id: 1

visitjeju:
  base-url: https://api.visitjeju.net
  api-key: ${VISITJEJU_API_KEY:}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com
  embedding-model: text-embedding-3-small
  chat-model: gpt-4o-mini
  timeout-ms: 8000

challenge:
  spot-visit:
    default-point: 50   # SPOT 타입(TourAPI 동기화, point 미설정) 방문 인증 시 기본 지급 포인트

sentry:
  dsn: ${SENTRY_DSN:}
  environment: production
  traces-sample-rate: 0.1
  send-default-pii: false
  ignored-exceptions-for-type: >
    org.springframework.web.context.request.async.AsyncRequestNotUsableException,
    org.springframework.web.servlet.resource.NoResourceFoundException,
    org.apache.catalina.connector.ClientAbortException