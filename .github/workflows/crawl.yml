name: Crawl VisitJeju Events

on:
  schedule:
    - cron: '0 19 * * 0'    # 일요일 19:00 UTC = 월요일 새벽 4시 KST
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install selenium requests

      - name: Crawl and ingest
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: python crawl.py